[package]
name = "llm-runner-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "llm_runner_rs"
path = "src/lib.rs"

[[bin]]
name = "llm-runner"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = { version = "0.1.79", features = ["metal"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration management
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"

# Web framework
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "timeout", "limit"] }

# Validation and security
validator = { version = "0.18", features = ["derive"] }
governor = "0.6"
futures = "0.3"

# Metrics
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
