[server]
host = "127.0.0.1"
port = 8080
timeout_seconds = 300

[model]
path = "./models/gemma-2-2b-it-Q4_K_M.gguf"
context_size = 2048
gpu_layers = 0

[inference]
max_tokens = 256
temperature = 0.7
top_p = 0.9
repeat_penalty = 1.1

[security]
rate_limit_per_minute = 60
max_prompt_length = 4096
max_concurrent_requests = 10
